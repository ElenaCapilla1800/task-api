spring.application.name=task-api

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taskapi}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8082

# Secreto para firmar los JWT (minimo 32 caracteres para HS256).
# Se lee SIEMPRE de la variable de entorno JWT_SECRET. No tiene valor por defecto:
# si falta, la aplicacion no arranca, para no usar nunca una clave publica por error.
jwt.secret=${JWT_SECRET}
